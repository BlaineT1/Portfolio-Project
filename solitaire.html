<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a14">
  <meta name="description" content="Klondike Solitaire, draw one, with drag and drop, undo, and auto-finish. Free in your browser at Neon Arcade.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Neon Arcade">
  <meta property="og:title" content="Solitaire · Neon Arcade">
  <meta property="og:description" content="Klondike Solitaire, draw one, with drag and drop, undo, and auto-finish. Free in your browser at Neon Arcade.">
  <meta property="og:url" content="https://blainet1.github.io/Portfolio-Project/solitaire.html">
  <meta property="og:image" content="https://blainet1.github.io/Portfolio-Project/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <title>Solitaire · Neon Arcade</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("neon-arcade-theme") || "dark";</script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♠️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <nav class="top-nav"><a href="index.html">◂ ARCADE</a></nav>

  <main class="game-shell game-shell-wide">
    <h1 class="game-title" style="color: var(--teal)">♠️ SOLITAIRE</h1>

    <div class="scorebar">
      <span class="chip">Moves <b id="moves">0</b></span>
      <span class="chip">Best <b id="best">—</b></span>
    </div>

    <div class="stage stage-560 sol-stage">
      <div class="sol-board" id="board">
        <div class="sol-row sol-top">
          <div class="sol-pile sol-stock" id="stock" role="button" aria-label="Stock"></div>
          <div class="sol-pile sol-waste" id="waste" aria-label="Waste"></div>
          <div class="sol-gap"></div>
          <div class="sol-pile sol-found" aria-label="Foundation 1"></div>
          <div class="sol-pile sol-found" aria-label="Foundation 2"></div>
          <div class="sol-pile sol-found" aria-label="Foundation 3"></div>
          <div class="sol-pile sol-found" aria-label="Foundation 4"></div>
        </div>
        <div class="sol-row sol-tableau">
          <div class="sol-pile sol-col"></div><div class="sol-pile sol-col"></div><div class="sol-pile sol-col"></div><div class="sol-pile sol-col"></div><div class="sol-pile sol-col"></div><div class="sol-pile sol-col"></div><div class="sol-pile sol-col"></div>
        </div>
      </div>
      <div class="overlay hidden" id="overlay">
        <h2 id="overlay-title">YOU WIN!</h2>
        <p id="overlay-msg"></p>
        <button class="btn" id="overlay-btn">DEAL AGAIN</button>
      </div>
    </div>

    <div class="menu-row">
      <button class="btn btn-sm" id="new-btn">NEW DEAL</button>
      <button class="btn btn-sm btn-ghost" id="undo-btn">UNDO</button>
      <button class="btn btn-sm" id="finish-btn" hidden>AUTO FINISH</button>
    </div>

    <p class="hint">Click a card, then where it goes. Click a card twice to send it up to a foundation. Dragging works too. Z undoes.</p>
  </main>

  <script src="assets/arcade.js"></script>
  <script src="assets/solitaire.js"></script>
</body>
</html>
