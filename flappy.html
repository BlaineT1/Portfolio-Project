<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird · Neon Arcade</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐤</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <nav class="top-nav"><a href="index.html">◂ ARCADE</a></nav>

  <main class="game-shell">
    <h1 class="game-title" style="color: var(--orange)">🐤 FLAPPY BIRD</h1>

    <div class="scorebar">
      <span class="chip">Score <b id="score">0</b></span>
      <span class="chip">Best <b id="best">0</b></span>
    </div>

    <div class="stage stage-420">
      <canvas id="game" width="420" height="520"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="overlay-title">FLAPPY BIRD</h2>
        <p id="overlay-msg">Click, tap, or press Space to flap.<br>Thread the gaps. Don't touch anything.</p>
        <button class="btn" id="overlay-btn">START</button>
      </div>
    </div>

    <p class="hint">One point per pipe. It never gets easier — you just get better.</p>
  </main>

  <script src="assets/arcade.js"></script>
  <script src="assets/flappy.js"></script>
</body>
</html>
