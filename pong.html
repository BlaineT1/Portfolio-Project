<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pong · Neon Arcade</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("neon-arcade-theme") || "dark";</script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏓</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <nav class="top-nav"><a href="index.html">◂ ARCADE</a></nav>

  <main class="game-shell">
    <h1 class="game-title" style="color: var(--purple)">🏓 PONG</h1>

    <div class="scorebar">
      <span class="chip">You <b id="score">0</b></span>
      <span class="chip">CPU <b id="cpu">0</b></span>
      <span class="chip">Wins <b id="best">0</b></span>
    </div>

    <div class="stage stage-560">
      <canvas id="game" width="560" height="420"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="overlay-title">PONG</h2>
        <p id="overlay-msg">Move with the mouse, touch, or ↑ ↓ keys.<br>First to 7 wins the match.</p>
        <button class="btn" id="overlay-btn">START</button>
      </div>
    </div>

    <p class="hint">Hit with the paddle's edge for sharper angles. P pauses.</p>
  </main>

  <script src="assets/arcade.js"></script>
  <script src="assets/pong.js"></script>
</body>
</html>
