<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Bowl · Neon Arcade</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("neon-arcade-theme") || "dark";</script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <nav class="top-nav"><a href="index.html">◂ ARCADE</a></nav>

  <main class="game-shell">
    <h1 class="game-title" style="color: var(--orange)">🏈 NEON BOWL</h1>

    <div class="scorebar">
      <span class="chip">You <b id="you">0</b></span>
      <span class="chip">CPU <b id="cpu">0</b></span>
      <span class="chip">Down <b id="down">1st &amp; 10</b></span>
      <span class="chip">Clock <b id="clock">H1 1:30</b></span>
    </div>

    <div class="stage stage-560">
      <canvas id="game" width="560" height="420"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="overlay-title">NEON BOWL</h2>
        <p id="overlay-msg"></p>
        <button class="btn" id="overlay-btn">KICKOFF</button>
      </div>
    </div>

    <div class="pad play-pad" id="pad" hidden>
      <button class="pad-btn play-btn" data-play="bomb">1 BOMB</button>
      <button class="pad-btn play-btn" data-play="slant">2 SLANT</button>
      <button class="pad-btn play-btn" data-play="run">3 RUN</button>
      <button class="pad-btn play-btn" data-play="fg">4 FIELD GOAL</button>
      <button class="pad-btn play-btn" data-play="punt">5 PUNT</button>
    </div>

    <p class="hint" id="status">Pick a play to snap the ball.</p>
    <p class="hint" id="season-line"></p>
    <p class="hint">Offense: arrows or drag to run, Space or tap a receiver to throw. Defense: you're the cyan linebacker. Space stops the kick meter. P pauses.</p>
  </main>

  <script src="assets/arcade.js"></script>
  <script src="assets/neonbowl.js"></script>
</body>
</html>
