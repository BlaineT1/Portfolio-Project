<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a14">
  <meta name="robots" content="noindex">
  <meta name="description" content="Game requests for Neon Arcade.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <title>Game Requests · Neon Arcade</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("neon-arcade-theme") || "dark";</script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <nav class="top-nav"><a href="index.html">◂ ARCADE</a></nav>

  <main class="requests">
    <h1 class="logo">GAME REQUESTS</h1>

    <form class="req-gate" id="req-gate" autocomplete="off">
      <p>Enter the password to see what everyone asked for.</p>
      <input class="sb-search" id="req-pass" type="password" inputmode="numeric" placeholder="Password" aria-label="Password" required>
      <button class="btn btn-sm" type="submit">UNLOCK</button>
      <p class="req-error" id="req-error" role="alert" hidden>Wrong password.</p>
    </form>

    <section id="req-list-wrap" hidden>
      <p class="req-actions">
        <a class="btn btn-sm request-btn" href="https://github.com/BlaineT1/Portfolio-Project/issues/new?template=game-request.yml" target="_blank" rel="noopener">💬 Request a game</a>
        <button class="btn btn-sm btn-ghost" id="req-lock" type="button">LOCK</button>
      </p>
      <p class="req-status" id="req-status" role="status">Loading…</p>
      <ul class="req-list" id="req-list"></ul>
    </section>
  </main>

  <script src="assets/arcade.js"></script>
  <script src="assets/requests.js"></script>
</body>
</html>
