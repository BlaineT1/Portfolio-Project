<body>
  <nav class="top-nav"><a href="index.html">◂ ARCADE</a></nav>

  <main class="game-shell">
    <h1 class="game-title" style="color: var(--cyan)">❌ TIC-TAC-TOE</h1>

    <div class="scorebar">
      <span class="chip">You <b id="you">0</b></span>
      <span class="chip">CPU <b id="cpu">0</b></span>
      <span class="chip">Wins <b id="best">0</b></span>
    </div>

    <div class="stage stage-420">
      <div class="ttt-board" id="board"></div>
      <div class="overlay hidden" id="overlay">
        <h2 id="overlay-title"></h2>
        <p id="overlay-msg"></p>
        <button class="btn" id="overlay-btn">PLAY AGAIN</button>
      </div>
    </div>

    <p class="hint" id="status">You are X. The CPU is mostly ruthless — mostly.</p>
  </main>

  <script src="assets/arcade.js"></script>
  <script src="assets/ttt.js"></script>
</body>
</html>
