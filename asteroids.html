<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asteroids · Neon Arcade</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("neon-arcade-theme") || "dark";</script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☄️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <nav class="top-nav"><a href="index.html">◂ ARCADE</a></nav>

  <main class="game-shell">
    <h1 class="game-title" style="color: var(--teal)">☄️ ASTEROIDS</h1>

    <div class="scorebar">
      <span class="chip">Score <b id="score">0</b></span>
      <span class="chip">Lives <b id="lives">❤❤❤</b></span>
      <span class="chip">Wave <b id="wave">1</b></span>
      <span class="chip">Best <b id="best">0</b></span>
    </div>

    <div class="stage stage-520">
      <canvas id="game" width="520" height="520"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="overlay-title">ASTEROIDS</h2>
        <p id="overlay-msg">◂ ▸ turn · ▴ thrust · Space fires.<br>Big rocks split. Everything wraps.</p>
        <button class="btn" id="overlay-btn">START</button>
      </div>
    </div>

    <div class="pad">
      <button class="pad-btn" id="btn-left" aria-label="Turn left">◂</button>
      <button class="pad-btn" id="btn-thrust" aria-label="Thrust">▴</button>
      <button class="pad-btn" id="btn-fire" aria-label="Fire">●</button>
      <button class="pad-btn" id="btn-right" aria-label="Turn right">▸</button>
    </div>

    <p class="hint">Small rocks are worth the most. P pauses.</p>
  </main>

  <script src="assets/arcade.js"></script>
  <script src="assets/asteroids.js"></script>
</body>
</html>
