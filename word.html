<body>
  <nav class="top-nav"><a href="index.html">◂ ARCADE</a></nav>

  <main class="game-shell">
    <h1 class="game-title" style="color: var(--lime)">🔤 WORD GUESS</h1>

    <div class="scorebar">
      <span class="chip">Streak <b id="streak">0</b></span>
      <span class="chip">Best <b id="best">0</b></span>
    </div>

    <div class="stage stage-420">
      <div class="word-board" id="board"></div>
      <div class="overlay hidden" id="overlay">
        <h2 id="overlay-title"></h2>
        <p id="overlay-msg"></p>
        <button class="btn" id="overlay-btn">NEW WORD</button>
      </div>
    </div>

    <div class="kb" id="keyboard"></div>

    <p class="hint">Guess the 5-letter word in 6 tries. Green = right spot, yellow = wrong spot.</p>
  </main>

  <script src="assets/arcade.js"></script>
