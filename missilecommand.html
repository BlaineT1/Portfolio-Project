  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💥</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <nav class="top-nav"><a href="index.html">◂ ARCADE</a></nav>

  <main class="game-shell">
    <h1 class="game-title" style="color: var(--orange)">💥 MISSILE COMMAND</h1>

    <div class="scorebar">
      <span class="chip">Score <b id="score">0</b></span>
      <span class="chip">Cities <b id="cities">6</b></span>
      <span class="chip">Wave <b id="wave">1</b></span>
      <span class="chip">Best <b id="best">0</b></span>
    </div>

    <div class="stage stage-560 mc-stage">
      <canvas id="game" width="560" height="360"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="overlay-title">MISSILE COMMAND</h2>
        <p id="overlay-msg">Click or tap anywhere to fire an interceptor from your nearest silo.<br>Protect your six cities from the falling sky.</p>
        <button class="btn" id="overlay-btn">START</button>
      </div>
    </div>

    <p class="hint">Interceptors always detonate where you aim. Later waves split into multiple warheads. P pauses.</p>
  </main>

  <script src="assets/arcade.js"></script>
  <script src="assets/missilecommand.js"></script>
</body>
</html>
