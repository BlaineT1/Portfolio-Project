name: Deploy to GitHub Pages

# Publishes the site to the gh-pages branch, which GitHub Pages serves.
# Pushing to gh-pages only needs the default token's contents:write,
# so no repo-admin permissions are involved.

# ▼▼▼ AUTO-DEPLOY PAUSED ▼▼▼  Uncomment "push" below to resume deploying on every
# push (the site was taken offline on request; ask to turn it back on).
on:
  # push:
  #   branches: [claude/rename-repo-game-website-piwcue]
  workflow_dispatch:
# ▲▲▲ AUTO-DEPLOY PAUSED ▲▲▲

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish to gh-pages
        run: git push --force origin HEAD:refs/heads/gh-pages
