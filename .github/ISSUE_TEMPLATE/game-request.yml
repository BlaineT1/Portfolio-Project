name: Game request
description: Ask for a game to be added to Neon Arcade
title: "[Game request] "
labels: ["game-request"]
body:
  - type: input
    id: game
    attributes:
      label: Game name
      description: What game would you like to see?
      placeholder: e.g. Checkers, Tower Defense, Minesweeper variants
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What makes it fun?
      description: A sentence or two about the game, or a link to an open-source version (games must be free to include).
  - type: dropdown
    id: players
    attributes:
      label: Players
      options:
        - One player
        - Two players, same keyboard
        - Online multiplayer
