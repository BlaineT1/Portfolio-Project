<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a14">
  <meta name="description" content="Sokoban: push every crate onto a target across 12 levels, with undo. Free in your browser at Neon Arcade.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Neon Arcade">
  <meta property="og:title" content="Sokoban · Neon Arcade">
  <meta property="og:description" content="Sokoban: push every crate onto a target across 12 levels, with undo. Free in your browser at Neon Arcade.">
  <meta property="og:url" content="https://blainet1.github.io/Portfolio-Project/sokoban.html">
  <meta property="og:image" content="https://blainet1.github.io/Portfolio-Project/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <title>Sokoban · Neon Arcade</title>
  <script>document.documentElement.dataset.theme = localStorage.getItem("neon-arcade-theme") || "dark";</script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <nav class="top-nav"><a href="index.html">◂ ARCADE</a></nav>

  <main class="game-shell">
    <h1 class="game-title" style="color: var(--amber)">📦 SOKOBAN</h1>

    <div class="scorebar">
      <span class="chip">Level <b id="level">1</b></span>
      <span class="chip">Moves <b id="moves">0</b></span>
      <span class="chip">Pushes <b id="pushes">0</b></span>
    </div>

    <div class="stage stage-480">
      <div class="soko-board" id="board" aria-label="Sokoban level"></div>
      <div class="overlay hidden" id="overlay">
        <h2 id="overlay-title">LEVEL CLEAR!</h2>
        <p id="overlay-msg"></p>
        <button class="btn" id="overlay-btn">NEXT LEVEL</button>
      </div>
    </div>

    <div class="pad">
      <button class="pad-btn" id="btn-left" aria-label="Left">◂</button>
      <button class="pad-btn" id="btn-up" aria-label="Up">▴</button>
      <button class="pad-btn" id="btn-down" aria-label="Down">▾</button>
      <button class="pad-btn" id="btn-right" aria-label="Right">▸</button>
    </div>
    <div class="menu-row">
      <button class="btn btn-sm btn-ghost" id="undo-btn">UNDO</button>
      <button class="btn btn-sm btn-ghost" id="restart-btn">RESTART</button>
    </div>
    <div class="menu-row" id="levels" aria-label="Levels"></div>

    <p class="hint">Push every crate onto a pink target. Arrows, WASD, the pad, or swipes move you. Z undoes, R restarts. Crates only push, never pull.</p>
  </main>

  <script src="assets/arcade.js"></script>
  <script src="assets/sokoban.js"></script>
</body>
</html>
